<!DOCTYPE html>
<html lang="en">

<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FACE - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>

<body class="h-screen overflow-hidden relative flex items-center justify-center">
    <!-- Floating Particles -->
    <div class="absolute inset-0 overflow-hidden pointer-events-none">
        <div class="particle" style="left: 10%; animation-delay: 0s;"></div>
        <div class="particle" style="left: 20%; animation-delay: 1s;"></div>
        <div class="particle" style="left: 30%; animation-delay: 2s;"></div>
        <div class="particle" style="left: 70%; animation-delay: 0.5s;"></div>
        <div class="particle" style="left: 80%; animation-delay: 1.5s;"></div>
        <div class="particle" style="left: 90%; animation-delay: 2.5s;"></div>
    </div>

    <!-- Login Card -->
    <div class="glass-card rounded-2xl w-full max-w-md mx-4 p-8 shadow-2xl slide-in z-10">
        <!-- Logo -->
        <div class="text-center mb-8">
            <div class="w-24 h-24 logo-glow rounded-full mx-auto mb-4 flex items-center justify-center float-animation"
                style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
                <span class="text-4xl font-bold text-white">F</span>
            </div>
            <h1 class="text-3xl font-bold text-white/90 mb-2">PFRP</h1>
            <p class="text-white/70 text-sm">𝗽𝗿𝗶𝘃𝗮𝗰𝘆-𝗳𝗶𝗿𝘀𝘁 𝗥𝗔𝗚 𝗽𝗹𝗮𝘁𝗳𝗼𝗿𝗺 </p>
        </div>

        <!-- Login Form -->
        <form method="POST" action="{% url 'enter_id' %}" class="space-y-6">
            {% csrf_token %}

            <!-- Error Message -->
            {% if error %}
            <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-xl relative" role="alert">
                <span class="block sm:inline">{{ error }}</span>
            </div>
            {% endif %}

            <!-- User ID Input -->
            <div>
                <label for="user_id" class="block text-sm font-medium text-white/90 mb-2">
                    <i class="fas fa-user mr-2"></i>User ID
                </label>
                <input type="text" id="user_id" name="user_id" required placeholder="Enter your user ID"
                    class="w-full p-4 glass-card rounded-xl input-glow transition-all duration-300 text-gray-800 placeholder-gray-500 shadow-lg border-0 focus:ring-2 focus:ring-purple-500"
                    autofocus>
            </div>

            <!-- Submit Button -->
            <button type="submit"
                class="w-full gradient-button text-white py-4 px-6 rounded-xl font-medium hover-lift shadow-lg transition-all duration-300">
                <i class="fas fa-sign-in-alt mr-2"></i>Login
            </button>
        </form>

        <!-- Footer -->
        <div class="mt-8 text-center">
            <p class="text-white/60 text-sm">
                <i class="fas fa-lock mr-1"></i>Secure Authentication Required
            </p>
        </div>
    </div>
</body>

</html>
